<section class="slide center entropy-timeline-slide"
  data-note="Mostre que a entropia muda de linguagem: primeiro energia, depois microestados, depois incerteza em dados."
  data-stage-count="4"
  aria-labelledby="slide-title">

  <header class="entropy-timeline-slide__head">
    <span class="kicker">Uma mesma ideia, três linguagens</span>
    <h2 id="slide-title">Entropia</h2>
  </header>

  <div class="entropy-timeline-slide__viewport">
    <div class="entropy-timeline-slide__rail">
      <div class="entropy-timeline-slide__track" aria-hidden="true"></div>

      <ol class="entropy-timeline-slide__steps" aria-label="Linha do tempo evolutiva da entropia">
        <li class="entropy-timeline-slide__step">
          <button class="entropy-timeline-slide__item" aria-current="step"
            data-year="1850"
            data-area="Termodinâmica"
            data-title="Calor, trabalho e máquinas térmicas"
            data-concept="A entropia nasce da tentativa de entender por que nem toda energia térmica pode ser convertida em trabalho útil. Aqui, ela aparece ligada à direção natural dos processos físicos.">
            <span class="entropy-timeline-slide__dot thermo" aria-hidden="true"></span>
            <time class="entropy-timeline-slide__tick-year" datetime="1850">1850</time>
            <span class="entropy-timeline-slide__field">Termodinâmica</span>
          </button>
        </li>

        <li class="entropy-timeline-slide__step">
          <button class="entropy-timeline-slide__item"
            data-year="1865"
            data-area="Termodinâmica"
            data-title="Clausius e a Segunda Lei"
            data-concept="Clausius formaliza a entropia como uma grandeza de estado. Em um sistema isolado, ela não diminui: processos espontâneos possuem uma direção preferencial.">
            <span class="entropy-timeline-slide__dot thermo" aria-hidden="true"></span>
            <time class="entropy-timeline-slide__tick-year" datetime="1865">1865</time>
            <span class="entropy-timeline-slide__field">Termodinâmica</span>
          </button>
        </li>

        <li class="entropy-timeline-slide__step">
          <button class="entropy-timeline-slide__item"
            data-year="1877"
            data-area="Mecânica estatística"
            data-title="Boltzmann e os microestados"
            data-concept="A entropia passa a ter uma interpretação microscópica: ela mede quantas configurações internas diferentes podem produzir o mesmo estado observado macroscopicamente.">
            <span class="entropy-timeline-slide__dot stat" aria-hidden="true"></span>
            <time class="entropy-timeline-slide__tick-year" datetime="1877">1877</time>
            <span class="entropy-timeline-slide__field">Mecânica estatística</span>
          </button>
        </li>

        <li class="entropy-timeline-slide__step">
          <button class="entropy-timeline-slide__item"
            data-year="1948"
            data-area="Teoria da informação"
            data-title="Shannon e a incerteza"
            data-concept="A entropia deixa de depender diretamente de calor ou moléculas e passa a medir incerteza: quanto menos previsível é uma mensagem, maior é a informação média associada a ela.">
            <span class="entropy-timeline-slide__dot info" aria-hidden="true"></span>
            <time class="entropy-timeline-slide__tick-year" datetime="1948">1948</time>
            <span class="entropy-timeline-slide__field">Informação</span>
          </button>
        </li>

        <li class="entropy-timeline-slide__step">
          <button class="entropy-timeline-slide__item"
            data-year="Hoje"
            data-area="Análise de dados"
            data-title="Padrões, regularidade e previsibilidade"
            data-concept="Na análise de dados, a entropia vira uma ferramenta para quantificar desordem, diversidade, regularidade e previsibilidade em séries temporais, imagens, redes e sistemas complexos.">
            <span class="entropy-timeline-slide__dot data" aria-hidden="true"></span>
            <span class="entropy-timeline-slide__tick-year">Hoje</span>
            <span class="entropy-timeline-slide__field">Dados</span>
          </button>
        </li>
      </ol>
    </div>
  </div>

  <article class="card entropy-timeline-slide__detail" aria-live="polite">
    <div class="entropy-timeline-slide__area" id="detail-area">Termodinâmica</div>
    <div class="entropy-timeline-slide__year" id="detail-year">1850</div>
    <h3 class="entropy-timeline-slide__title" id="detail-title">Calor, trabalho e máquinas térmicas</h3>
    <p class="entropy-timeline-slide__concept" id="detail-concept">
      A entropia nasce da tentativa de entender por que nem toda energia térmica pode ser convertida em trabalho útil. Aqui, ela aparece ligada à direção natural dos processos físicos.
    </p>
  </article>

</section>
