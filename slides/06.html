<section class="slide sim-real-slide" data-stage-count="3" data-note="Use este slide como transição entre a simulação e o experimento real. Primeiro a ideia, depois a simulação, depois o vídeo, e por fim a reprodução.">
  <div class="sim-real-slide__left">
    <div class="kicker">Transição</div>
    <h2 class="sim-real-slide__left-title">Simular passou a ser confortável.</h2>
    <div class="sim-real-slide__sim card sim-real-slide__panel sim-real-slide__panel--sim">
      <div class="sim-real-slide__label">Simulação</div>
      <div class="fish-demo sim-real-slide__fish-demo">
        <div class="shoal-canvas-widget" style="--shoal-size: min(100%, 400px);">
          <canvas class="shoal-canvas" data-fish-count="11" aria-label="Cardume animado da simulação"></canvas>
          <div class="shoal-canvas-widget__glow" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="sim-real-slide__right">
    <div class="kicker sim-real-slide__right-kicker">Experimento</div>
    <h2 class="sim-real-slide__right-title">e no mundo real?</h2>
    <div class="sim-real-slide__video card sim-real-slide__panel sim-real-slide__panel--video">
      <div class="sim-real-slide__video-head">
        <span class="sim-real-slide__label">Vídeo experimental</span>
        <span class="sim-real-slide__video-tag">video.mp4</span>
      </div>

      <div class="sim-real-slide__video-frame sim-real-slide__video-frame--ready">
        <video
          class="sim-real-slide__video-element"
          src="video.mp4"
          controls
          muted
          playsinline
          preload="metadata"></video>
      </div>
    </div>
  </div>
</section>
